<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>PDF to Word</title>
  <style>
    :root { --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --ring: #e2e8f0; --brand: #0d9488; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8; --ring: #1e293b; --brand: #2dd4bf; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Segoe UI", Tahoma, sans-serif; }
    .box { text-align: center; }
    .spin { width: 44px; height: 44px; margin: 0 auto 18px; border: 4px solid var(--ring); border-top-color: var(--brand); border-radius: 50%; animation: s 0.9s linear infinite; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>جارٍ تشغيل المحو&#x651;ل…</h1>
    <p>لحظات ويصبح جاهز&#x64B;ا</p>
  </div>
</body>
</html>
